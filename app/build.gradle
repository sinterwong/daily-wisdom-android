plugins { id 'com.android.application' }

android {
    namespace 'com.sinter.daily'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sinter.daily'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        personal {
            def keyPath = System.getenv('SIGNING_KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('SIGNING_KEYSTORE_PATH')) signingConfig signingConfigs.personal
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError true
        // The source language is Chinese; this personal application is not localized.
        disable 'HardcodedText', 'SetTextI18n'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
