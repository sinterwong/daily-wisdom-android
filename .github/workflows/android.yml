name: Build and test Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare_release.py --tag "$RELEASE_TAG"
      - name: Validate extracted quotes
        run: python3 scripts/check_quotes.py
      - name: Test, lint and build installable debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/daily-wisdom.apk
          cd dist && sha256sum daily-wisdom.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: daily-wisdom-apk
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-reports
          path: app/build/reports/

  device-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest
            adb pull /data/local/tmp/widget-short.png app/build/reports/widget-short.png
            adb pull /data/local/tmp/widget-long.png app/build/reports/widget-long.png
            adb pull /data/local/tmp/favorites.png app/build/reports/favorites.png
            adb pull /data/local/tmp/widget-square.png app/build/reports/widget-square.png
            adb pull /data/local/tmp/widget-strip.png app/build/reports/widget-strip.png
            adb pull /data/local/tmp/widget-accessible.png app/build/reports/widget-accessible.png
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.sinter.daily/.MainActivity
            adb shell input keyevent 82
            adb shell screencap -p /sdcard/daily-wisdom.png
            adb pull /sdcard/daily-wisdom.png app/build/reports/daily-wisdom.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-reports
          path: app/build/reports/

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, device-smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: daily-wisdom-apk
          path: ci-apk
      - name: Prepare versioned release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare_release.py --tag "$RELEASE_TAG" --artifact-dir ci-apk
      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "false" ]; then
              echo "Release already published; preserving its existing assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "一日一句 $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --json url,assets
