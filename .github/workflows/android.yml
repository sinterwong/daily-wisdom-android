name: Build and test Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate extracted quotes
        run: python3 scripts/check_quotes.py
      - name: Test, lint and build installable debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/daily-wisdom.apk
          cd dist && sha256sum daily-wisdom.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: daily-wisdom-apk
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-reports
          path: app/build/reports/

  device-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest
            adb shell am start -n com.sinter.daily/.MainActivity
            adb shell input keyevent 82
            adb shell screencap -p /sdcard/daily-wisdom.png
            adb pull /sdcard/daily-wisdom.png app/build/reports/daily-wisdom.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-reports
          path: app/build/reports/
